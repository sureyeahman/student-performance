[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "student-performance"
version = "0.1.0"
description = "Predict a student's final Portuguese grade (G3) to flag students at risk of failing."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.5.4",
    "pandas==3.1.0",
    "scikit-learn==1.9.1",
    "matplotlib==3.11.2",
    "seaborn==0.13.2",
    "joblib==1.6.0",
    "PyYAML==6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.2",
    "jupyter==1.1.1",
]

[project.scripts]
student-performance = "student_performance.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N"]
ignore = ["N803", "N806"]  # allow sklearn's capital X / X_train
